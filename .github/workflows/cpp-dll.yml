name: Build C++ Test DLL

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -S test_dll -B build_dll -G "Visual Studio 17 2022" -A x64

    - name: Build
      run: cmake --build build_dll --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: test-dll-x64
        path: build_dll/Release/test_dll.dll
